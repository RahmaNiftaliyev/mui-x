<svg xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" viewBox="0 0 920 210"><defs><marker id="arrow2" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#99A7BB" d="M 0 1 L 9 5 L 0 9 z"/></marker></defs><rect width="200" height="150" x="20" y="30" fill="#FFF" stroke="#DAE2ED" stroke-width="1.5" rx="8"/><circle cx="46" cy="56" r="12" fill="#0073E6"/><text x="46" y="60.5" fill="#FFF" font-size="12" font-weight="600" text-anchor="middle">1</text><text x="66" y="61" fill="#1C2025" font-size="14" font-weight="600">Edit</text><text x="36" y="90" fill="#4B5565" font-size="12">The editor opens on the</text><text x="36" y="108" fill="#4B5565" font-size="12">formula source, not on the</text><text x="36" y="126" fill="#4B5565" font-size="12">evaluated value.</text><rect width="168" height="24" x="36" y="140" fill="#F0F7FF" rx="5"/><text x="120" y="156" fill="#0073E6" font-family="Menlo, Consolas, monospace" font-size="11" text-anchor="middle">=B1 * C1</text><line x1="220" x2="246" y1="105" y2="105" stroke="#99A7BB" stroke-width="1.5" marker-end="url(#arrow2)"/><rect width="200" height="150" x="250" y="30" fill="#FFF" stroke="#DAE2ED" stroke-width="1.5" rx="8"/><circle cx="276" cy="56" r="12" fill="#0073E6"/><text x="276" y="60.5" fill="#FFF" font-size="12" font-weight="600" text-anchor="middle">2</text><text x="296" y="61" fill="#1C2025" font-size="14" font-weight="600">Commit</text><text x="266" y="90" fill="#4B5565" font-size="12">A1 references freeze to</text><text x="266" y="108" fill="#4B5565" font-size="12">canonical form and the</text><text x="266" y="126" fill="#4B5565" font-size="12">source is written to the row.</text><rect width="168" height="24" x="266" y="140" fill="#F0F7FF" rx="5"/><text x="350" y="156" fill="#0073E6" font-family="Menlo, Consolas, monospace" font-size="11" text-anchor="middle">=REF(COLUMN(&quot;price&quot;), …)</text><line x1="450" x2="476" y1="105" y2="105" stroke="#99A7BB" stroke-width="1.5" marker-end="url(#arrow2)"/><rect width="200" height="150" x="480" y="30" fill="#FFF" stroke="#DAE2ED" stroke-width="1.5" rx="8"/><circle cx="506" cy="56" r="12" fill="#0073E6"/><text x="506" y="60.5" fill="#FFF" font-size="12" font-weight="600" text-anchor="middle">3</text><text x="526" y="61" fill="#1C2025" font-size="14" font-weight="600">Re-evaluate</text><text x="496" y="90" fill="#4B5565" font-size="12">The engine recomputes the</text><text x="496" y="108" fill="#4B5565" font-size="12">edited cell and its dependents</text><text x="496" y="126" fill="#4B5565" font-size="12">in dependency order —</text><text x="496" y="144" fill="#4B5565" font-size="12">nothing else is touched.</text><line x1="680" x2="706" y1="105" y2="105" stroke="#99A7BB" stroke-width="1.5" marker-end="url(#arrow2)"/><rect width="190" height="150" x="710" y="30" fill="#FFF" stroke="#DAE2ED" stroke-width="1.5" rx="8"/><circle cx="736" cy="56" r="12" fill="#0073E6"/><text x="736" y="60.5" fill="#FFF" font-size="12" font-weight="600" text-anchor="middle">4</text><text x="756" y="61" fill="#1C2025" font-size="14" font-weight="600">Render</text><text x="726" y="90" fill="#4B5565" font-size="12">Only cells whose result</text><text x="726" y="108" fill="#4B5565" font-size="12">changed re-render, and</text><text x="726" y="126" fill="#4B5565" font-size="12">sorting, filtering, and</text><text x="726" y="144" fill="#4B5565" font-size="12">aggregation are refreshed.</text></svg>